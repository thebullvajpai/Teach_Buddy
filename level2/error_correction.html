<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error Correction · TeachBuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0a0f'/><text x='50%' y='68%' font-family='sans-serif' font-weight='800' font-size='52' fill='%233db8a0' text-anchor='middle'>TB</text></svg>">
</head>

<body class="tb-shell">

  <div class="tb-container-narrow">

    <header class="tb-reveal mb-6 flex flex-wrap items-center justify-between gap-3">
      <a class="tb-back" href="level2_dashboard.html">← Mixed practice</a>
      <span class="tb-chip">Error correction · Level 2</span>
    </header>

    <section class="tb-panel tb-reveal">

      <div class="flex items-center justify-between gap-3 text-xs font-bold uppercase tracking-[0.14em] text-violet-500">
        <span id="counter">Loading…</span>
        <span id="streak">Streak 0</span>
      </div>
      <div class="tb-progress mt-2"><span id="bar" style="width:0%"></span></div>

      <div class="mt-7 rounded-2xl border border-[var(--tb-border)] bg-[var(--tb-surface-2)] px-5 py-5">
        <div class="tb-eyebrow text-rose-400">This sentence has a mistake</div>
        <p id="sentence" class="mt-2 text-xl font-extrabold leading-snug text-[color:var(--tb-ink)]"></p>
      </div>

      <div class="mt-5">
        <input class="tb-input text-base" type="text" id="userAnswer" placeholder="Write the corrected sentence…"
          autocomplete="off" autocapitalize="sentences">
      </div>

      <div id="result"></div>

      <div class="mt-6 grid gap-3 sm:grid-cols-2">
        <button class="tb-btn" type="button" id="checkBtn">Check answer</button>
        <button class="tb-btn-secondary" type="button" id="nextBtn">Next sentence →</button>
      </div>

      <div class="mt-3 grid gap-3 sm:grid-cols-2">
        <button class="tb-btn-soft" type="button" id="hintBtn">Hint</button>
        <button class="tb-btn-soft" type="button" id="copyBtn">Copy sentence</button>
      </div>

      <p class="tb-muted mt-5 text-center text-xs">
        Capitalisation and full stops are ignored. Words are compared directly.
      </p>

    </section>

  </div>

  <script src="../js/site.js" data-root="../" data-page="mixed"></script>
  <script>
    (function () {
      var questions = [];
      var order = [];
      var step = 0;
      var streak = 0;

      var sentenceEl = document.getElementById("sentence");
      var input = document.getElementById("userAnswer");
      var result = document.getElementById("result");
      var counter = document.getElementById("counter");
      var streakEl = document.getElementById("streak");
      var bar = document.getElementById("bar");

      function normalize(text) {
        return String(text)
          .toLowerCase()
          .replace(/[.,!?;:'"]/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function shuffle(list) {
        var a = list.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function key(s) { return String(s).toLowerCase().replace(/[.,!?;:'"]/g, ""); }

      /**
       * Longest-common-subsequence table between the two word lists. A simple
       * position-by-position compare would flag every word after an inserted or
       * deleted one, which drowns the actual correction in highlights.
       */
      function lcs(w, r) {
        var n = w.length, m = r.length, i, j;
        var dp = [];
        for (i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
        for (i = n - 1; i >= 0; i--) {
          for (j = m - 1; j >= 0; j--) {
            dp[i][j] = key(w[i]) === key(r[j])
              ? dp[i + 1][j + 1] + 1
              : Math.max(dp[i + 1][j], dp[i][j + 1]);
          }
        }
        return dp;
      }

      /** The corrected sentence with only the genuinely new words highlighted. */
      function diffHtml(wrong, right) {
        var w = String(wrong).split(/\s+/);
        var r = String(right).split(/\s+/);
        var dp = lcs(w, r);
        var out = [], i = 0, j = 0;

        var mark = function (word) {
          return '<mark class="rounded-md bg-emerald-500/20 px-1 font-extrabold text-emerald-300">' +
            escapeHtml(word) + "</mark>";
        };

        while (i < w.length && j < r.length) {
          if (key(w[i]) === key(r[j])) { out.push(escapeHtml(r[j])); i++; j++; }
          else if (dp[i + 1][j] >= dp[i][j + 1]) { i++; }   // word removed
          else { out.push(mark(r[j])); j++; }               // word added / changed
        }
        while (j < r.length) { out.push(mark(r[j])); j++; }

        return out.join(" ");
      }

      /** Index in the wrong sentence where it first diverges from the correct one. */
      function firstDiffIndex(wrong, right) {
        var w = String(wrong).split(/\s+/);
        var r = String(right).split(/\s+/);
        var dp = lcs(w, r);
        var i = 0, j = 0;

        while (i < w.length && j < r.length) {
          if (key(w[i]) === key(r[j])) { i++; j++; }
          else if (dp[i + 1][j] >= dp[i][j + 1]) { return i; }  // extra/incorrect word here
          else { return i; }                                    // something is missing here
        }
        return i < w.length ? i : -1;
      }

      fetch("data/error_correction.json")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          questions = data.questions || [];
          if (!questions.length) throw new Error("no questions");
          order = shuffle(questions.map(function (_, i) { return i; }));
          loadQuestion();
        })
        .catch(function (err) {
          console.error(err);
          counter.textContent = "Unavailable";
          result.className = "tb-feedback-bad";
          result.textContent = "Couldn't load the exercises. Please refresh the page.";
        });

      function current() { return questions[order[step]]; }

      function clearResult() {
        result.className = "";
        result.textContent = "";
      }

      function loadQuestion() {
        sentenceEl.textContent = current().sentence;
        input.value = "";
        clearResult();
        counter.textContent = "Sentence " + (step + 1) + " of " + order.length;
        streakEl.textContent = "Streak " + streak;
        bar.style.width = (step / order.length) * 100 + "%";
        input.focus();
      }

      function checkAnswer() {
        var user = normalize(input.value);
        if (!user) {
          result.className = "tb-feedback-bad";
          result.textContent = "Write the corrected sentence first.";
          return;
        }

        if (user === normalize(current().correct)) {
          streak++;
          streakEl.textContent = "Streak " + streak;
          result.className = "tb-feedback-ok";
          result.innerHTML = "Correct: " + diffHtml(current().sentence, current().correct);
          if (streak % 5 === 0) window.TB.confetti(70);
        } else {
          streak = 0;
          streakEl.textContent = "Streak 0";
          result.className = "tb-feedback-bad";
          result.innerHTML =
            "Not quite. The correct sentence is:<br><span class='mt-1 block'>" +
            diffHtml(current().sentence, current().correct) +
            "</span>";
        }
      }

      function hint() {
        var w = current().sentence.split(/\s+/);
        var at = firstDiffIndex(current().sentence, current().correct);

        result.className = "tb-feedback-ok";
        result.textContent =
          at === -1
            ? "Something is missing near the end. Check the punctuation as well."
            : "Check word " + (at + 1) + ": “" + w[at] + "”";
      }

      document.getElementById("checkBtn").addEventListener("click", checkAnswer);
      document.getElementById("nextBtn").addEventListener("click", function () {
        step++;
        if (step >= order.length) {
          step = 0;
          order = shuffle(order);
          window.TB.confetti(110);
        }
        loadQuestion();
      });
      document.getElementById("hintBtn").addEventListener("click", hint);
      document.getElementById("copyBtn").addEventListener("click", function () {
        input.value = current().sentence;
        input.focus();
      });

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") checkAnswer();
      });
    })();
  </script>
</body>

</html>
