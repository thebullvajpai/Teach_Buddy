<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topic Quiz · TeachBuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0a0f'/><text x='50%' y='68%' font-family='sans-serif' font-weight='800' font-size='52' fill='%233db8a0' text-anchor='middle'>TB</text></svg>">
</head>

<body class="tb-shell">

  <div class="tb-container-narrow">

    <!-- ============================ HEAD ============================ -->
    <header class="tb-reveal mb-6 flex flex-wrap items-center justify-between gap-3">
      <a class="tb-back" href="practice.html">← All topics</a>
      <div class="flex items-center gap-2">
        <span class="tb-chip" id="topicChip">Level 1 · Practice</span>
        <a class="tb-btn-soft" id="notesLink" href="notes.html">Notes</a>
      </div>
    </header>

    <!-- =========================== QUIZ ============================ -->
    <section class="tb-panel tb-reveal" id="quizPanel">

      <!-- progress -->
      <div id="progressWrap">
        <div class="flex items-center justify-between gap-3 text-xs font-bold uppercase tracking-[0.14em] text-violet-500">
          <span id="qCounter">Question 1</span>
          <span id="scoreCounter">Score 0</span>
        </div>
        <div class="tb-progress mt-2"><span id="progressBar" style="width:0%"></span></div>
      </div>

      <!-- question -->
      <div id="quizBody" class="mt-7">
        <div class="tb-shimmer h-6 w-3/4 rounded-lg"></div>
        <div class="mt-5 space-y-3">
          <div class="tb-shimmer h-14 rounded-2xl"></div>
          <div class="tb-shimmer h-14 rounded-2xl"></div>
          <div class="tb-shimmer h-14 rounded-2xl"></div>
        </div>
      </div>

    </section>

    <p class="tb-muted mt-5 text-center">
      Tip: press <kbd class="rounded-md border border-violet-200 bg-white px-1.5 py-0.5 text-xs font-bold">1</kbd>–<kbd
        class="rounded-md border border-violet-200 bg-white px-1.5 py-0.5 text-xs font-bold">4</kbd> to answer and
      <kbd class="rounded-md border border-violet-200 bg-white px-1.5 py-0.5 text-xs font-bold">Enter</kbd> for the next
      question.
    </p>

  </div>

  <script src="../js/site.js" data-root="../" data-page="practice"></script>
  <script>
    (function () {
      var LETTERS = ["A", "B", "C", "D", "E", "F"];

      var panel = document.getElementById("quizPanel");
      var body = document.getElementById("quizBody");
      var progressWrap = document.getElementById("progressWrap");
      var progressBar = document.getElementById("progressBar");
      var qCounter = document.getElementById("qCounter");
      var scoreCounter = document.getElementById("scoreCounter");

      var topicId = (new URLSearchParams(window.location.search).get("topic") || "").trim();
      var meta = window.TB.topics.filter(function (t) { return t.id === topicId; })[0];

      /* ---------------------------------------------------------- *
       * No topic in the URL → offer the whole list instead of an alert
       * ---------------------------------------------------------- */
      if (!meta) {
        progressWrap.style.display = "none";
        body.innerHTML =
          '<h1 class="text-2xl font-extrabold">Pick a topic to practise</h1>' +
          '<p class="tb-muted mt-2">Select any topic to begin.</p>' +
          '<div class="mt-6 flex flex-wrap gap-2.5" id="pick"></div>';

        var pick = document.getElementById("pick");
        window.TB.topics.forEach(function (t) {
          var a = document.createElement("a");
          a.className = "tb-word";
          a.href = "all_quiz.html?topic=" + encodeURIComponent(t.id);
          a.textContent = t.title;
          pick.appendChild(a);
        });
        return;
      }

      document.title = meta.title + " Quiz · TeachBuddy";
      document.getElementById("topicChip").textContent = meta.title + " · Level 1";
      document.getElementById("notesLink").href = "Notes/" + meta.note;

      /* ---------------------------------------------------------- *
       * State
       * ---------------------------------------------------------- */
      var questions = [];
      var order = [];
      var step = 0;
      var score = 0;
      var answered = false;
      var current = null;

      function shuffle(n) {
        var a = [];
        for (var i = 0; i < n; i++) a.push(i);
        for (var j = a.length - 1; j > 0; j--) {
          var k = Math.floor(Math.random() * (j + 1));
          var tmp = a[j]; a[j] = a[k]; a[k] = tmp;
        }
        return a;
      }

      fetch("quiz/" + topicId + ".json")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          questions = data.questions || [];
          if (!questions.length) throw new Error("empty quiz");
          order = shuffle(questions.length);
          render();
        })
        .catch(function (e) {
          console.error(e);
          progressWrap.style.display = "none";
          body.innerHTML =
            '<h1 class="text-2xl font-extrabold">Quiz not available</h1>' +
            '<p class="tb-muted mt-2">We couldn\'t load the questions for this topic. You can still read the notes or try another topic.</p>' +
            '<div class="mt-6 flex flex-wrap gap-3">' +
            '<a class="tb-btn" href="Notes/' + meta.note + '">📖 Read the notes</a>' +
            '<a class="tb-btn-secondary" href="practice.html">← All topics</a>' +
            "</div>";
        });

      /* ---------------------------------------------------------- *
       * Render a question
       * ---------------------------------------------------------- */
      function render() {
        if (step >= order.length) return finish();

        answered = false;
        current = questions[order[step]];

        qCounter.textContent = "Question " + (step + 1) + " of " + order.length;
        scoreCounter.textContent = "Score " + score + " / " + step;
        progressBar.style.width = (step / order.length) * 100 + "%";

        var html =
          '<h1 class="text-xl font-extrabold leading-snug sm:text-2xl">' + esc(current.question) + "</h1>" +
          '<div class="mt-5 space-y-3" id="options"></div>' +
          '<div id="explain"></div>' +
          '<button class="tb-btn mt-6 w-full" id="nextBtn" type="button" disabled>Choose an answer</button>';

        body.innerHTML = html;
        body.classList.remove("tb-pop");
        void body.offsetWidth;
        body.classList.add("tb-pop");

        var options = document.getElementById("options");
        current.options.forEach(function (opt, i) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "tb-option";
          b.innerHTML =
            '<span class="tb-option-key">' + (LETTERS[i] || i + 1) + "</span><span>" + esc(opt) + "</span>";
          b.addEventListener("click", function () { choose(b, i); });
          options.appendChild(b);
        });

        document.getElementById("nextBtn").addEventListener("click", next);
      }

      function choose(button, index) {
        if (answered) return;
        answered = true;

        var all = document.querySelectorAll(".tb-option");
        all.forEach(function (node, i) {
          node.classList.add("is-locked");
          if (i === current.answer) node.classList.add("is-correct");
        });

        if (index === current.answer) {
          score++;
        } else {
          button.classList.add("is-wrong");
        }

        scoreCounter.textContent = "Score " + score + " / " + (step + 1);

        var explain = document.getElementById("explain");
        explain.className = "tb-explain";
        explain.innerHTML =
          '<strong class="font-extrabold text-teal-400">' +
          (index === current.answer ? "Correct. " : "Explanation: ") +
          "</strong>" +
          esc(current.explanation || "");

        var nextBtn = document.getElementById("nextBtn");
        nextBtn.disabled = false;
        nextBtn.textContent = step + 1 >= order.length ? "See my result →" : "Next question →";
        nextBtn.focus();
      }

      function next() {
        if (!answered) return;
        step++;
        render();
      }

      /* ---------------------------------------------------------- *
       * Result — informational only, nothing is unlocked or blocked
       * ---------------------------------------------------------- */
      function finish() {
        var pct = order.length ? Math.round((score / order.length) * 100) : 0;

        // Remember the personal best purely so the practice page can show it.
        // Nothing reads this to allow or block anything.
        var raw = window.TB.store("tb_best_" + topicId, null);
        var prev = raw === null ? -1 : parseInt(raw, 10);
        if (isNaN(prev) || pct > prev) window.TB.save("tb_best_" + topicId, String(pct));

        var tone =
          pct >= 80 ? { line: "Outstanding score on this topic.", color: "#10b981" } :
          pct >= 60 ? { line: "Good progress. Review the notes to sharpen remaining areas.", color: "#38bdf8" } :
          pct >= 40 ? { line: "Good effort. Reviewing the notes will reinforce these concepts.", color: "#f59e0b" } :
                      { line: "Review the topic notes and try again.", color: "#fb7185" };

        progressBar.style.width = "100%";
        qCounter.textContent = "Completed";
        scoreCounter.textContent = "Score " + score + " / " + order.length;

        var nextTopic = window.TB.topics[(indexOfTopic() + 1) % window.TB.topics.length];

        body.innerHTML =
          '<div class="tb-cheer text-center">' +
            '<div class="tb-result-ring" style="background: conic-gradient(' + tone.color + ' ' + (pct * 3.6) + 'deg, var(--tb-border) 0deg)">' +
              '<div class="grid h-28 w-28 place-items-center rounded-full bg-[var(--tb-surface-2)] shadow-inner">' +
                '<div><div class="text-3xl font-extrabold" style="color:' + tone.color + '">' + pct + '%</div>' +
                '<div class="text-[10px] font-bold uppercase tracking-[0.14em] text-slate-400">' + score + ' of ' + order.length + '</div></div>' +
              "</div>" +
            "</div>" +
            '<h1 class="mt-6 text-2xl font-extrabold">' + meta.title + " quiz complete</h1>" +
            '<p class="tb-muted mx-auto mt-2 max-w-md">' + tone.line + '</p>' +
          "</div>" +
          '<div class="mt-7 grid gap-3 sm:grid-cols-2">' +
            '<button class="tb-btn" type="button" id="retry">Try again</button>' +
            '<a class="tb-btn-secondary" href="Notes/' + meta.note + '">Re-read notes</a>' +
            '<a class="tb-btn-secondary" href="all_quiz.html?topic=' + encodeURIComponent(nextTopic.id) + '">Practise ' + nextTopic.title + '</a>' +
            '<a class="tb-btn-secondary" href="practice.html">All topics</a>' +
          "</div>";

        document.getElementById("retry").addEventListener("click", function () {
          order = shuffle(questions.length);
          step = 0;
          score = 0;
          render();
        });

        if (pct >= 60) window.TB.confetti(pct >= 80 ? 130 : 80);
      }

      function indexOfTopic() {
        for (var i = 0; i < window.TB.topics.length; i++) {
          if (window.TB.topics[i].id === topicId) return i;
        }
        return 0;
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      /* ---------------------------------------------------------- *
       * Keyboard shortcuts
       * ---------------------------------------------------------- */
      document.addEventListener("keydown", function (e) {
        if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;

        if (!answered && /^[1-6]$/.test(e.key)) {
          var opts = document.querySelectorAll(".tb-option");
          var idx = parseInt(e.key, 10) - 1;
          if (opts[idx]) opts[idx].click();
        } else if (answered && e.key === "Enter") {
          var btn = document.getElementById("nextBtn");
          if (btn && !btn.disabled) btn.click();
        }
      });
    })();
  </script>
</body>

</html>
